name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.package }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [web, server]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    env:
      # Prisma config requires a URL; generation does not connect to a database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cortex_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx --no-install prisma generate --generator client

      - name: Lint frontend
        if: matrix.package == 'web'
        run: npm run lint

      - name: Type-check frontend
        if: matrix.package == 'web'
        run: npx --no-install tsc --noEmit --incremental false

      - name: Type-check backend
        if: matrix.package == 'server'
        # Include prisma.config.ts alongside src without changing build settings.
        run: npx --no-install tsc --noEmit --rootDir .
